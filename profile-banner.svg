<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="240" fill="#0d1117"/>
  
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="240" fill="url(#grid)" />

  <text x="30" y="50" fill="#58a6ff" font-family="monospace" font-size="24" font-weight="bold">KENDRICK LAWTON</text>
  <text x="30" y="75" fill="#8b949e" font-family="monospace" font-size="14">SOFTWARE ENGINEER // PROJECT-PLATFORM</text>
  
  <g transform="translate(30, 105)">
    <rect x="0" y="0" width="80" height="28" fill="#00add8" fill-opacity="0.1" stroke="#00add8" stroke-width="1"/>
    <text x="40" y="19" fill="#00add8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">GO</text>
    
    <rect x="90" y="0" width="80" height="28" fill="#326ce5" fill-opacity="0.1" stroke="#326ce5" stroke-width="1"/>
    <text x="130" y="19" fill="#326ce5" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">K8S</text>
    
    <rect x="180" y="0" width="80" height="28" fill="#844fba" fill-opacity="0.1" stroke="#844fba" stroke-width="1"/>
    <text x="220" y="19" fill="#844fba" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">TF</text>
  </g>

  <g transform="translate(450, 40)">
    <rect width="320" height="170" fill="#161b22" stroke="#30363d"/>
    <text x="15" y="25" fill="#7d8590" font-family="monospace" font-size="11">// API v1 ENDPOINTS</text>
    
    <text x="15" y="55" fill="#bc8cff" font-family="monospace" font-size="12">GET</text>
    <text x="55" y="55" fill="#e6edf3" font-family="monospace" font-size="12">/v1/auth/login</text>
    
    <text x="15" y="80" fill="#bc8cff" font-family="monospace" font-size="12">GET</text>
    <text x="55" y="80" fill="#e6edf3" font-family="monospace" font-size="12">/v1/admin/status</text>
    
    <text x="15" y="105" fill="#ffa657" font-family="monospace" font-size="12">POST</text>
    <text x="55" y="105" fill="#e6edf3" font-family="monospace" font-size="12">/v1/projects</text>
    
    <text x="15" y="130" fill="#ffa657" font-family="monospace" font-size="12">POST</text>
    <text x="55" y="130" fill="#e6edf3" font-family="monospace" font-size="12">/v1/deployments</text>
    
    <rect x="15" y="150" width="8" height="2" fill="#58a6ff">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <circle cx="35" cy="205" r="4" fill="#238636">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="50" y="209" fill="#7d8590" font-family="monospace" font-size="11">SYSTEM_OPERATIONAL // NODES_HEALTHY: 3</text>
</svg>
