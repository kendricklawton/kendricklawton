<svg width="1200" height="360" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="240" fill="#0d1117"/>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="240" fill="url(#grid)" />

  <!-- Header Section -->
  <text x="30" y="30" fill="#58a6ff" font-family="monospace" font-size="24" font-weight="bold">KENDRICK LAWTON</text>
  <text x="30" y="55" fill="#8b949e" font-family="monospace" font-size="14">SOFTWARE ENGINEER // CLOUD-NATIVE PLATFORMS</text>

  <!-- Tech Pills Section (sharp edges) -->
  <g transform="translate(30, 80)">
    <!-- DISTRIBUTED -->
    <rect x="0" y="0" width="100" height="28" fill="#00add8" fill-opacity="0.1" stroke="#00add8" stroke-width="1"/>
    <text x="50" y="14" fill="#00add8" font-family="monospace" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">DISTRIBUTED</text>

    <!-- CI/CD -->
    <rect x="112" y="0" width="100" height="28" fill="#ffa657" fill-opacity="0.1" stroke="#ffa657" stroke-width="1"/>
    <text x="162" y="14" fill="#ffa657" font-family="monospace" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">CI/CD</text>

    <!-- KUBERNETES -->
    <rect x="224" y="0" width="100" height="28" fill="#326CE5" fill-opacity="0.1" stroke="#326CE5" stroke-width="1"/>
    <text x="274" y="14" fill="#326CE5" font-family="monospace" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">KUBERNETES</text>

    <!-- CNCF -->
    <rect x="0" y="40" width="100" height="28" fill="#844fba" fill-opacity="0.1" stroke="#844fba" stroke-width="1"/>
    <text x="50" y="54" fill="#844fba" font-family="monospace" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">CNCF</text>

    <!-- DEVOPS -->
    <rect x="112" y="40" width="100" height="28" fill="#f7df1e" fill-opacity="0.1" stroke="#f7df1e" stroke-width="1"/>
    <text x="162" y="54" fill="#f7df1e" font-family="monospace" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">DEVOPS</text>

    <!-- LINUX -->
    <rect x="224" y="40" width="100" height="28" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-width="1"/>
    <text x="274" y="54" fill="#3fb950" font-family="monospace" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">LINUX</text>
  </g>

  <!-- Right Terminal box -->
  <g transform="translate(450, 30)">
    <rect width="320" height="165" fill="#161b22" stroke="#30363d"/>
    <text x="15" y="25" fill="#7d8590" font-family="monospace" font-size="11">// API v1 ENDPOINTS</text>

    <text x="15" y="52" fill="#bc8cff" font-family="monospace" font-size="12">GET</text>
    <text x="55" y="52" fill="#e6edf3" font-family="monospace" font-size="12">/v1/auth/login</text>

    <text x="15" y="77" fill="#bc8cff" font-family="monospace" font-size="12">GET</text>
    <text x="55" y="77" fill="#e6edf3" font-family="monospace" font-size="12">/v1/admin/status</text>

    <text x="15" y="102" fill="#ffa657" font-family="monospace" font-size="12">POST</text>
    <text x="55" y="102" fill="#e6edf3" font-family="monospace" font-size="12">/v1/projects</text>

    <text x="15" y="127" fill="#ffa657" font-family="monospace" font-size="12">POST</text>
    <text x="55" y="127" fill="#e6edf3" font-family="monospace" font-size="12">/v1/deployments</text>

    <rect x="15" y="145" width="8" height="2" fill="#58a6ff">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Status Bar -->
  <circle cx="35" cy="220" r="4" fill="#238636">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="50" y="224" fill="#7d8590" font-family="monospace" font-size="11">SYSTEM_OPERATIONAL // NODES_HEALTHY: 3 // K8S_CLUSTER: OK // OS: LINUX</text>
</svg>
